
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK: $SDK"

          SdkManager=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SdkManager" ]; then
            echo "sdkmanager not found. Installing command-line tools..."

            mkdir -p "$SDK/cmdline-tools"

            cd "$SDK/cmdline-tools"

            curl -fsSL \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              -o tools.zip

            mkdir -p temp
            unzip -q tools.zip -d temp

            rm -rf latest
            mv temp/cmdline-tools latest
            rm -rf temp tools.zip

            SdkManager="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SdkManager"

          echo "SDK Manager found: $SdkManager"
          echo "SDKMANAGER=$SdkManager" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          echo "Checking SDK installation..."
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Grant Gradle execute permission
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug
          else
            echo "ERROR: Gradle wrapper and system Gradle are missing."
            exit 1
          fi

      - name: Locate APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taktychnyi-Urbanist-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

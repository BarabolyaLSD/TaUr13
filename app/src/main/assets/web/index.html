<title>Тактичний урбаніст</title>
<style>
:root{--bg:#0a1018;--bg2:#101a29;--pan:#121c2b;--bd:#2b4a72;--cy:#7fd6ff;--bl:#2ea8ff;--I:#d9822b;--M:#d6383c;--D:#5aa0f0;--tx:#e4ecf8;--mu:#8fa3bf;--ok:#4fd18b;--warn:#ffb84d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -10%,#173057 0,#0a1018 60%) fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:8px 10px 40px}
h1{font-size:26px;margin:14px 0 4px;text-align:center;letter-spacing:.5px;text-shadow:0 0 14px #2ea8ff88}
.sub{color:var(--mu);text-align:center;margin:0 0 14px;font-size:14px}
.panel{background:linear-gradient(180deg,#16233a,#0e1726);border:1.5px solid var(--bd);border-radius:14px;padding:10px 12px;margin:10px 0}
.panel h3{margin:0 0 8px;font-size:13px;letter-spacing:1px;color:var(--cy);text-transform:uppercase}
input[type=text]{width:100%;padding:13px 14px;font-size:18px;border-radius:12px;border:1.5px solid var(--bd);background:#0b1422;color:var(--tx);outline:none}
input[type=text]:focus{border-color:var(--bl);box-shadow:0 0 0 3px #2ea8ff33}
select{padding:10px;border-radius:10px;border:1.5px solid var(--bd);background:#0b1422;color:var(--tx);font-size:15px}
button{font:inherit;color:var(--tx);border:1.5px solid var(--bd);background:#16253d;border-radius:12px;padding:12px 14px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
button.pri{background:linear-gradient(180deg,#2d7fd0,#1c5aa0);border-color:#6fc0ff;font-weight:700}
button.ok{background:linear-gradient(180deg,#2fa36a,#1c7a4c);border-color:#7ff0b4;font-weight:700}
button.dng{background:#3a1a22;border-color:#a8404f}
button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
.pl{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #22344f}.pl:last-child{border:0}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--bd);color:var(--cy);background:#0b1422;white-space:nowrap}
.tag.host{color:var(--warn);border-color:#6b5a2a}.tag.bot{color:#c9a7ff;border-color:#5b4690}.tag.off{color:#ff8a8a;border-color:#7a3a3a}
header.top{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:6px 0;border-radius:14px;background:#0e1828;border:1.5px solid var(--bd);position:sticky;top:4px;z-index:5}
header.top img{width:34px;height:34px}
.ph{font-size:12px;color:var(--mu)}.ph b{color:var(--cy);font-size:14px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.oc{min-width:150px;flex:1;scroll-snap-align:start;background:linear-gradient(180deg,#16233a,#0e1726);border:1.5px solid var(--bd);border-radius:12px;padding:8px}
.oc.act{border-color:var(--warn);box-shadow:0 0 12px #ffb84d55}
.oc.sel{border-color:var(--bl);box-shadow:0 0 0 3px #2ea8ff66}
.oc .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{display:flex;gap:8px;margin-top:4px;font-size:14px;align-items:center;flex-wrap:wrap}
.cnt span{display:inline-flex;align-items:center;gap:2px}.cnt img{width:20px;height:20px}.cnt i{font-style:normal;color:var(--mu);font-size:11px}
.en{display:flex;gap:4px;flex-wrap:nowrap;margin:2px 0 6px}
.en div{width:11.5%;aspect-ratio:1;border-radius:50%;border:2px solid #2b4a72;background:#070d17;display:flex;align-items:center;justify-content:center}
.en div.on{border-color:var(--bl);box-shadow:0 0 8px #2ea8ff99}.en img{width:100%;height:100%}
.brow{display:flex;align-items:center;gap:6px;margin:6px 0}
.brow .lb{width:52px;text-align:center;font-size:11px;color:var(--mu)}.brow .lb img{width:34px;height:34px;display:block;margin:0 auto}
.slots{display:flex;gap:5px;flex:1}
.sl{flex:1;aspect-ratio:1;border-radius:9px;border:2px dashed #2b3d58;background:#070d17;display:flex;align-items:center;justify-content:center;position:relative}
.sl.goal{border-color:#41618a}.sl img{width:92%;height:92%}.sl.fill{border-style:solid}
.sl.fill.I{border-color:var(--I)}.sl.fill.M{border-color:var(--M)}.sl.fill.D{border-color:var(--D)}.sl.ruin{border-style:solid;border-color:#555}
.cn{font-size:14px;width:40px;text-align:right;font-weight:700}.cn.done{color:var(--ok)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts button{display:flex;align-items:center;gap:8px;text-align:left;padding:10px}
.acts button img{width:34px;height:34px}.acts button small{display:block;color:var(--mu);font-size:12px}
.acts button.sel{border-color:var(--ok);box-shadow:0 0 0 3px #4fd18b55}
.hand{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cd{width:46%;max-width:190px;border-radius:12px;position:relative;cursor:pointer;border:3px solid transparent;transition:.15s}
.cd img{width:100%;display:block;border-radius:10px}.cd.dim{opacity:.45;filter:grayscale(.5)}
.cd.sel{border-color:var(--ok);box-shadow:0 0 14px #4fd18b99;transform:translateY(-4px)}
.cd.dis{border-color:var(--M);box-shadow:0 0 14px #d6383c99}
.log{font-size:13px;color:#c8d6ea}.log div{padding:5px 0;border-bottom:1px solid #1c2c44}.log .round{color:var(--cy);font-weight:700}.log .event{color:#ffd28a}.log .win{color:var(--ok);font-weight:700}
.msg{padding:10px;border-radius:10px;background:#0b1a2e;border:1px dashed #3d6aa3;text-align:center;color:var(--cy)}
.big{font-size:17px;font-weight:700}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:#0f1a2c;border:2px solid var(--bl);border-radius:16px;padding:18px;max-width:420px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.modal img.zoom{width:100%;max-width:340px;border-radius:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#3a1a22;border:1.5px solid #ff8a8a;padding:10px 16px;border-radius:12px;z-index:30;display:none;max-width:90%;text-align:center}
#net{position:fixed;top:0;left:0;right:0;background:#7a3a3a;text-align:center;padding:4px;font-size:13px;z-index:40;display:none}
.url{font-family:ui-monospace,Consolas,monospace;background:#070d17;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin:4px 0;word-break:break-all;color:var(--cy);font-size:14px}
.rules li{margin:5px 0}
.trophy{font-size:54px}

/* Interactive tactical city map layer */
.city-scene{touch-action:none;cursor:grab;isolation:isolate;pointer-events:auto;background:none!important}
.city-map-bg{position:absolute;inset:0;z-index:0;background:#08121b url('img/city.webp') center 53%/cover;transform-origin:top left;pointer-events:none;will-change:transform;filter:brightness(.66) saturate(.86) contrast(1.06)}

let token = localStorage.getItem('tu_token') || '', ver = 0, S = null, urls = [], netOK = true, lastKey = '';

async function api(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const d = await r.json().catch(()=>({error:'Помилка відповіді'}));
  if(!r.ok){ if(d.error==='bad_token'){ resetSession(); } throw new Error(d.error||'Помилка'); }
  return d;
}
function act(type, extra){ return api('/api/action', Object.assign({token, type}, extra||{})).catch(e=>{ toast(e.message); }); }
function resetSession(){ token=''; ver=0; localStorage.removeItem('tu_token'); S=null; renderedJoin=false; ui.card=ui.target=ui.pending=null; render(); kick(); }

async function poll(){
  if(polling) return; polling = true;
  while(true){
    try{
      ctl = new AbortController(); const mine = ctl; const to = setTimeout(()=>mine.abort(), 30000);
      const r = await fetch(`/api/state?token=${encodeURIComponent(token)}&v=${ver}`, {signal: mine.signal, cache:'no-store'});
      clearTimeout(to);
      if(r.status===401){ resetSession(); await sleep(500); continue; }
      const d = await r.json();
      setNet(true);
      if(d.v !== ver || !S){ ver = d.v; S = d; onState(); render(); }
      else { S = d; }
    }catch(e){ if(e && e.name==='AbortError'){ continue; } setNet(false); await sleep(1500); }
  }
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function setNet(ok){ netOK=ok; $('#net').style.display = ok?'none':'block'; }
async function loadInfo(){ try{ const r=await fetch('/api/info'); urls=(await r.json()).urls||[]; }catch(e){} }

function me(){ return S && S.players.find(p=>p.id===S.you); }
function pl(id){ return S.players.find(p=>p.id===id); }
function onState(){
  // скидання вибору при зміні фази
  const key = S.phase+':'+S.round;
  if(key!==lastKey){ lastKey=key; ui.card=null; ui.target=null; ui.pending=null; }
  const my = !!(S.event_open) || (S.phase==='build' && S.you && !S.mine_submitted);
  if(my && !wasMyTurn && navigator.vibrate) try{ navigator.vibrate(120); }catch(e){}
  wasMyTurn = my;
  if(S.hand && ui.card!=null && ui.card>=S.hand.length) ui.card=null;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(){
  const app = $('#app');
  if(!S){ app.innerHTML = '<h1>Тактичний урбаніст</h1><p class="sub">Підключення…</p>'; return; }
  if(!token || !S.you){ return renderJoin(app); }
  renderedJoin = false;
  if(S.phase==='lobby') return renderLobby(app);
  renderGame(app);
}

function playersList(withActions){
  const host = S.host;
  return S.players.map(p=>{
    const tags = [];
    if(p.id===host) tags.push('<span class="tag host">господар</span>');
    if(p.kind==='ai') tags.push('<span class="tag bot">бот</span>');
    if(p.kind==='neighbor') tags.push(`<span class="tag bot">Сусід · поріг ${p.thr}+</span>`);
    if(p.kind==='human' && !p.online) tags.push('<span class="tag off">офлайн</span>');
    if(p.id===S.you) tags.push('<span class="tag">ви</span>');
    const rm = (withActions && S.you===host && p.id!==S.you) || (withActions && p.id===S.you && S.phase==='lobby' && S.you!==host)
      ? `<button class="dng" data-act="remove" data-id="${p.id}" style="padding:6px 10px">✕</button>` : '';
    return `<div class="pl"><span class="grow big">${esc(p.name)}</span>${tags.join(' ')}${rm}</div>`;
  }).join('') || '<div class="sub">Поки нікого</div>';
}

  if(renderedJoin){ const l=$('#plist'); if(l) l.innerHTML = playersList(false); const s=$('#seats'); if(s) s.innerHTML=seatsHtml(); return; }
  renderedJoin = true;
  app.innerHTML = `<h1>⚡ Тактичний урбаніст</h1><p class="sub">Мережева версія для тестування</p>

function seatsHtml(){
  if(S.phase==='lobby' || !S.seats || !S.seats.length) return '';
  return `<div class="panel"><h3>Зайняти вільне місце</h3>`+S.seats.map(id=>{const p=pl(id);
    return `<div class="pl"><span class="grow">${esc(p.name)}</span><button class="pri" data-act="claim" data-id="${id}">Зайняти</button></div>`}).join('')+`</div>`;
}
async function doJoin(seat){
  const name = (ui.name||'').trim(); if(!name){ toast('Введіть ім’я'); return; }
  try{
    const d = await api('/api/join', {name, seat: seat||undefined});
    token = d.token; localStorage.setItem('tu_token', token); localStorage.setItem('tu_name', name);
    ver = 0; S = null; renderedJoin = false; render(); kick();
  }catch(e){ toast(e.message); }
}

function mapPointerUp(e){mapState.pointers.delete(e.pointerId);if(mapState.pointers.size<2)mapState.pinchStart=0;if(!mapState.pointers.size){$('.city-scene')?.classList.remove('map-drag');if(mapState.drag)mapState.skipClick=true;else mapState.lastSector=mapState.startSector;mapState.drag=false;mapState.start=mapState.last=null;mapState.startSector=null;}}
function bindMap(){const scene=$('.city-scene');if(!scene||scene.dataset.mapBound)return;scene.dataset.mapBound='1';scene.addEventListener('pointerdown',mapPointerDown);scene.addEventListener('pointermove',mapPointerMove);scene.addEventListener('pointerup',mapPointerUp);scene.addEventListener('pointercancel',mapPointerUp);scene.querySelector('.map-tools')?.addEventListener('click',e=>{const b=e.target.closest('[data-map]');if(!b)return;if(b.dataset.map==='zoomin')mapZoom(mapState.scale*1.2);else if(b.dataset.map==='zoomout')mapZoom(mapState.scale/1.2);else mapReset();});scene.addEventListener('wheel',e=>{e.preventDefault();const p=mapPoint(e);mapZoom(mapState.scale*(e.deltaY<0?1.12:.89),p.x,p.y);},{passive:false});scene.addEventListener('click',e=>{if(mapState.skipClick){mapState.skipClick=false;return;}const polygon=e.target.closest('[data-sector]'),sid=polygon?.dataset.sector||mapState.lastSector;if(sid){mapFocus(+sid);render();}mapState.lastSector=null;});scene.addEventListener('dblclick',e=>{const poly=e.target.closest('[data-sector]');if(poly)mapFocus(+poly.dataset.sector);});}

        <div class="cnt"><span><img src="img/energy.webp">${p.E}</span><span>🃏${p.hand}</span>${st}${p.kind==='human'&&!p.online?'<span class="tag off">офлайн</span>':''}</div>
        <div class="cnt">${cntHtml(p)}</div>${p.id===S.active?'<div class="tag host" style="margin-top:4px;display:inline-block">маркер події</div>':''}</div>`;
    }).join('') + `</div>`;
  // моя дошка
  h += `<div class="panel city-panel"><h3>Моє місто · ${esc(m.name)}</h3>
    <div class="city-scene" role="application" aria-label="Інтерактивна стратегічна карта міста"><span class="scene-label">МІСЬКА КАРТА · ТЕРИТОРІЇ</span>
      <div class="city-map-bg" aria-hidden="true"></div><svg class="city-map-svg" viewBox="0 0 1000 600" aria-label="Сектори міста" preserveAspectRatio="none"><g id="map-world"></g></svg>
      <div class="map-tools"><button data-map="zoomout" aria-label="Зменшити масштаб">−</button><button data-map="reset" aria-label="Скинути камеру">⌖</button><button data-map="zoomin" aria-label="Збільшити масштаб">+</button></div>
      <div class="map-hint">Виберіть власний сектор для будівництва · Перетягування · Pinch масштаб</div>
      <div class="map-legend"><span style="color:#30b9ff"><i style="background:#30b9ff"></i>Гравець</span><span style="color:#ff4058"><i style="background:#ff4058"></i>Суперник 1</span><span style="color:#2fe28d"><i style="background:#2fe28d"></i>Суперник 2</span><span style="color:#ffd044"><i style="background:#ffd044"></i>Суперник 3</span></div>
      <div class="map-sector-info" id="map-sector-info"><strong>Міський огляд</strong><span class="sector-owner">Обирайте сектор для перегляду його характеристик.</span></div></div>
    <div class="row" style="justify-content:space-between;font-size:13px;color:var(--mu)"><span>Енергія ${m.E}/${R.E_MAX}</span><span>приріст на початку раунду: <b style="color:var(--cy)">+${income}</b></span></div>
    <div class="en">${Array.from({length:R.E_MAX},(_,i)=>`<div class="${i<m.E?'on':''}">${i<m.E?'<img src="img/energy.webp">':''}</div>`).join('')}</div>`;
  for(const t of ['I','M','D']){
    const f=m[t], r=m['r'+t];
    h += `<div class="brow"><div class="lb"><img src="${ICON[t]}">${SHORT[t]}</div><div class="slots">`+
      Array.from({length:R.LIMIT},(_,i)=> i<f?`<div class="sl fill ${t}"><img src="${ICON[t]}"></div>` : i<f+r?`<div class="sl ruin"><img src="img/ruin.webp"></div>` : `<div class="sl ${i<3?'goal':''}"></div>`).join('')+
      `</div><div class="cn ${f>=3?'done':''}">${f}/3</div></div>`;
  }
  h += `<div class="ph" style="margin-top:4px">Мета: по 3 будівлі кожного типу одночасно. Рамка слотів 1–3 — мета.</div></div>`;
  // дії та рука (під час власної події рука вище)
  if(S.event_open){ // рука
    h += `<div class="panel"><h3>Рука (${(S.hand||[]).length}/${R.HAND})</h3>${handHtml()}${selInfo()}</div>`;
  h += `<div class="panel"><h3>${S.phase==='event'?'Подія':S.phase==='build'?'Ваш вибір':'Гра завершена'}</h3>${actionsHtml(m)}</div>`; }
  else { h += `<div class="panel"><h3>${S.phase==='event'?'Подія':S.phase==='build'?'Ваш вибір':'Гра завершена'}</h3>${actionsHtml(m)}</div>`;
  // рука
    h += `<div class="panel"><h3>Рука (${(S.hand||[]).length}/${R.HAND})</h3>${handHtml()}${selInfo()}</div>`; }
  // лог
  const lg = S.log.slice().reverse(); const show = ui.showLog ? lg : lg.slice(0,6);
  h += `<div class="panel"><h3>Хід гри</h3><div class="log">${show.map(l=>`<div class="${l.k}">${esc(l.t)}</div>`).join('')}</div>
    ${lg.length>6?`<button data-act="log" style="width:100%;margin-top:6px">${ui.showLog?'Згорнути':'Показати все'}</button>`:''}</div>`;
  if(h !== app._h){ app.innerHTML = h; app._h = h; bindMap(); }
  renderMap();
  if(S.phase==='over') showOver();
  else if(ui.zoom) showZoom(ui.zoom);
  else if(ui.rules) showRules();
}

function actionsHtml(m){
  const R=S.rules;
  if(S.phase==='over') return `<div class="msg">Партію завершено.</div>`;
  if(S.phase==='event'){
    if(S.event_open){
      const opp = S.players.filter(p=>p.id!==S.you);
      let hh = `<div class="msg">Ваша подія: оберіть карту, суперника та сектор атаки на карті міста.</div>`;
      hh += `<div class="row" style="margin-top:8px;flex-wrap:wrap">`+opp.map(p=>`<button class="${ui.target===p.id?'pri':''}" data-act="target" data-id="${p.id}">${p.kind!=='human'?'🤖 ':''}${esc(p.name)}</button>`).join('')+`</div>`;
      const c = ui.card!=null ? S.hand[ui.card] : null;
      const afford = ui.card!=null && S.can.play[ui.card];
      if(ui.target && c && c!=='cri') { const opponent=pl(ui.target), enemySecs=(S.sectors||[]).filter(s=>opponent&&s.owner===opponent.id); hh += `<div class="sub" style="margin-top:8px">Сектор противника для атаки:</div><div class="row" style="flex-wrap:wrap">`+enemySecs.map(s=>`<button class="${ui.targetSector===s.id?'pri':''}" data-act="targetSector" data-id="${s.id}">Сектор ${s.id}</button>`).join('')+`</div>`; }
      hh += `<div class="row" style="margin-top:10px"><button class="ok grow" data-act="play" ${(c&&afford&&ui.target&&(c==='cri'||ui.targetSector))?'':'disabled'}>Зіграти${c?` «${CARDS[c][0]}» (−${R.CARD_COST[c]}⚡`:''}</button></div>`;
      if(S.need_discard) hh += `<div class="row" style="margin-top:8px"><button class="dng grow" data-act="skip" ${ui.card==null?'disabled':''}>Скинути вибрану карту й пропустити</button></div><p class="sub">У руці забагато карт: щоб пропустити, оберіть карту для скидання.</p>`;
      else hh += `<div class="row" style="margin-top:8px"><button class="grow" data-act="skip">Не грати подію</button></div>`;
      return hh;
    }
    const a=pl(S.active); return `<div class="msg">Подію грає <b>${esc(a?a.name:'')}</b>… очікуйте.</div>`;
  }
  // build
  if(S.mine_submitted){ const n=S.players.filter(p=>p.submitted).length; return `<div class="msg">Вибір зроблено. Очікуємо інших: ${n}/${S.players.length}</div>`; }
  const targetSector=mapSectorData(mapState.selected),canPlace=targetSector.owner===S.you;let hh = `<div class="msg">Розміщення: <b>сектор ${mapState.selected}</b> · ${canPlace?'ваша територія':'чужа територія — оберіть власний сектор'}</div><div class="acts">`;
  for(const t of ['I','M','D']){
    const cb=S.can.build[t], cr=S.can.rebuild[t], pend = ui.pending && ui.pending.t===t;
    hh += `<button data-act="pick" data-k="build" data-t="${t}" class="${pend&&ui.pending.k==='build'?'sel':''}" ${cb&&canPlace?'':'disabled'}><img src="${ICON[t]}"><span>Збудувати<br><b>${NAME[t]}</b><small>−${R.COST[t]}⚡</small></span></button>`;
  }
  for(const t of ['I','M','D']){
    if(m['r'+t]>0){
      const cost=Math.floor((R.COST[t]+1)/2), pend = ui.pending && ui.pending.t===t;
      hh += `<button data-act="pick" data-k="rebuild" data-t="${t}" class="${pend&&ui.pending.k==='rebuild'?'sel':''}" ${S.can.rebuild[t]&&canPlace?'':'disabled'}><img src="img/ruin.webp"><span>Відновити<br><b>${NAME[t]}</b><small>−${cost}⚡ · руїн: ${m['r'+t]}</small></span></button>`;
    }
  }
  hh += `</div>`;
  const pend = ui.pending;
  hh += `<div class="row" style="margin-top:10px"><button class="ok grow" data-act="confirm" ${pend?'':'disabled'}>${pend?`Підтвердити: ${pend.k==='build'?'збудувати':'відновити'} ${NAME[pend.t].toLowerCase()} · сектор ${pend.sector||mapState.selected}`:'Оберіть дію'}</button></div>
        <div class="row" style="margin-top:8px"><button class="grow" data-act="none">Нічого не будувати (пас)</button></div>`;
  return hh;
}
function handHtml(){
  const hand = S.hand||[];
  if(!hand.length) return '<div class="sub">Карт немає. Карту бере активний гравець у фазі події.</div>';
  return `<div class="hand">`+hand.map((c,i)=>{
    const sel = ui.card===i, dim = S.event_open && !S.can.play[i] && !S.need_discard;
    return `<div class="cd ${sel?(S.need_discard?'dis':'sel'):''} ${dim?'dim':''}" data-act="card" data-i="${i}"><img src="img/${c}.webp" alt="${CARDS[c][0]}"></div>`;
  }).join('')+`</div>`;
}
function selInfo(){
  if(ui.card==null || !S.hand || !S.hand[ui.card]) return S.hand&&S.hand.length&&!S.event_open?'<div class="sub">Торкніться карти, щоб збільшити.</div>':'';
  const c=S.hand[ui.card]; return `<div class="msg" style="margin-top:8px"><b>${CARDS[c][0]}</b> (−${S.rules.CARD_COST[c]}⚡): ${CARDS[c][1]}</div>`;
}

function modal(html){ let m=$('#modal'); if(!m){ m=document.createElement('div'); m.id='modal'; m.className='modal'; document.body.appendChild(m); } m.innerHTML=`<div class="box">${html}</div>`; }
function closeModal(){ const m=$('#modal'); if(m) m.remove(); }
function showZoom(c){ modal(`<img class="zoom" src="img/${c}.webp"><p>${CARDS[c][1]}</p><button class="pri" data-act="close">Закрити</button>`); }
function showRules(){ modal(`<h3 style="margin-top:0">Правила коротко</h3><ol class="rules" style="text-align:left;padding-left:20px">
 <li><b>Мета:</b> першим мати одночасно по 3 промисловості, війська й оборони (перевірка наприкінці раунду).</li>
 <li><b>Старт:</b> 1 промисловість і 2 енергії у всіх.</li>
 <li><b>Раунд:</b> 1) усі отримують енергію (+1 за кожну промисловість, макс. 8); 2) <b>активний гравець</b> (маркер) бере карту й може зіграти одну проти суперника — <i>з 3-го раунду</i>; 3) усі одночасно роблять одну дію: збудувати або відновити руїну.</li>
 <li><b>Вартість:</b> промисловість 1, оборона 4, військо 5. Руїна відновлюється за половину.</li>
 <li><b>Карти:</b> Шпигун 2, Диверсія 3, Лихо 3, Криза 4, Генерал 6.</li>
 <li>У руці не більше 2 карт. Знищена будівля стає руїною й займає слот.</li></ol><button class="pri" data-act="close">Зрозуміло</button>`); }
function showOver(){
  const w = S.winners.map(id=>pl(id)).filter(Boolean); const mine = w.some(p=>p.id===S.you);
  modal(`<div class="trophy">${mine?'🏆':'🏁'}</div><h2 style="margin:6px 0">${mine?'Ви перемогли!':'Гру завершено'}</h2>
    <p class="big">Переможець: ${w.map(p=>esc(p.name)).join(', ')}</p>${S.cap?'<p class="sub">Ліміт раундів: більше будівель</p>':''}
    <div style="text-align:left">${S.players.map(p=>`<div class="pl"><span class="grow">${esc(p.name)}</span><span class="cnt">${cntHtml(p)}</span></div>`).join('')}</div>
    <div style="height:10px"></div>${S.you===S.host?'<button class="ok" style="width:100%" data-act="newgame">Нова гра (повернутися в лобі)</button>':'<p class="sub">Очікуйте, поки господар розпочне нову гру.</p>'}
    <button style="width:100%;margin-top:8px" data-act="logmodal">Журнал гри</button>`);
}

// ------------------------------------------------------------------ події
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, id = t.dataset.id!==undefined ? +t.dataset.id : null;
  if(t.dataset.map){if(t.dataset.map==='zoomin')mapZoom(mapState.scale*1.2);else if(t.dataset.map==='zoomout')mapZoom(mapState.scale/1.2);else mapReset();return;}
  if(a==='join') return doJoin();
  if(a==='claim') return doJoin(id);
  if(a==='rules'){ ui.rules=true; return showRules(); }
  if(a==='close'){ ui.rules=false; ui.zoom=null; if(S&&S.phase==='over') return showOver(); return closeModal(); }
  if(a==='addbot') return act('add_bot',{kind:'ai'});
  if(a==='addnb') return act('add_bot',{kind:'neighbor', thr: ui.thr});
  if(a==='remove') return act('remove',{id});
  if(a==='start') return act('start');
  if(a==='newgame'){ closeModal(); return act('new_game'); }
  if(a==='log'){ ui.showLog=!ui.showLog; return render(); }
  if(a==='logmodal'){ modal('<h3 style="margin-top:0">Журнал</h3><div class="log" style="text-align:left">'+S.log.slice().reverse().map(l=>`<div class="${l.k}">${esc(l.t)}</div>`).join('')+'</div><button class="pri" data-act="close">Закрити</button>'); return; }
  if(a==='target'){ if(S.event_open){ ui.target = ui.target===id?null:id; ui.targetSector=null; return render(); } return; }
  if(a==='targetSector'){ if(S.event_open){ ui.targetSector=ui.targetSector===id?null:id; return render(); } return; }
  if(a==='card'){ const i=+t.dataset.i;
    if(S.event_open){ ui.card = ui.card===i?null:i; return render(); }
    ui.zoom = S.hand[i]; return showZoom(S.hand[i]); }
  if(a==='play'){ const i=ui.card, tg=ui.target, sec=ui.targetSector; ui.card=ui.target=ui.targetSector=null; return act('play',{card:i, target:tg, sector:sec}); }
  if(a==='skip'){ const d = S.need_discard ? ui.card : undefined; ui.card=null; return act('skip', d!==undefined?{discard:d}:{}); }
  if(a==='pick'){ ui.pending={k:t.dataset.k, t:t.dataset.t, sector:mapState.selected}; return render(); }
  if(a==='confirm'){ const p=ui.pending; if(!p) return; ui.pending=null; return act(p.k,{b:p.t,sector:p.sector||mapState.selected}); }
  if(a==='none'){ ui.pending=null; return act('none'); }
});
loadInfo(); poll();
</script></body></html>
